[project]
name = "falkorflight"
version = "0.1.0"
description = "Apache Arrow Flight SQL server for interacting with FalkorDB."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=20.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11.7",
]


[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]

[tool.ruff.format]
quote-style = "single"
